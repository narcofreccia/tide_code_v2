<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1063 1063" width="1063" height="1063">
  <!--
    Tide mark, carried over from v1 (`tide_logo_only.svg`). The braces are the only
    monochrome part; they are painted with a neutral that reads on both a light and a
    dark browser-tab strip, because this file is used standalone (favicon). The React
    component `components/shell/Logo.tsx` draws the same mark with `currentColor`
    braces so it can inherit the surrounding text colour. The wave puzzle piece keeps
    its brand gradient and is embedded as a 192px PNG — it is never drawn larger than
    40 CSS px, so the 8192px original from v1 is pure weight.
  -->
  <text x="263.6" y="531.5" text-anchor="middle" dominant-baseline="middle"
    font-family="Times New Roman, Georgia, serif" font-size="780" fill="#8B93A3">{</text>
  <image href="data:image/png;base64," x="340.2" y="340.2" width="382.7" height="382.7"/>
  <text x="799.4" y="531.5" text-anchor="middle" dominant-baseline="middle"
    font-family="Times New Roman, Georgia, serif" font-size="780" fill="#8B93A3">}</text>
</svg>
