<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tide</title>
    <style>
      /* Same boot screen as tide_reel (BootScreen.svelte): lockup, a 2px milestone bar,
         a fading status line and the version. Also shown while the app closes. */
      :root {
        color-scheme: dark;
        --bg: #0e1013;
        --text: #e6e9ef;
        --label: #8b93a3;
        --border: #262b33;
        --accent: #5b9dff;
        --danger: #ef6a6a;
      }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --bg: #f6f7f9; --text: #131722; --label: #6a7285; --border: #dfe2e8; --accent: #2f6fe0; --danger: #c93b3b; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        -webkit-user-select: none; user-select: none;
        animation: appear 300ms ease-out both;
      }
      /* Overlay titlebar: Tauri drags from data-tauri-drag-region on a real element. */
      .drag { position: fixed; inset: 0 0 auto 0; height: 28px; z-index: 10; }
      .logo { display: flex; align-items: center; gap: 12px; height: 56px; }
      .mark { height: 56px; width: auto; display: block; }
      .word { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
      .track { margin-top: 40px; width: 160px; height: 2px; border-radius: 9999px; overflow: hidden; background: var(--border); }
      .fill { height: 100%; width: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0.04); transition: transform 200ms linear, background-color 200ms ease-out; }
      .fill.indeterminate { width: 40%; transform: none; transition: none; animation: slide 1.2s linear infinite; }
      body[data-state="failed"] .fill { background: var(--danger); }
      .status { display: grid; margin-top: 14px; min-height: 16px; font-size: 12px; line-height: 16px; color: var(--label); max-width: 70ch; padding: 0 24px; }
      .status > span { grid-area: 1 / 1; text-align: center; animation: appear 200ms ease-out both; }
      body[data-state="failed"] .status > span { color: var(--danger); white-space: pre-wrap; }
      #retry { display: none; margin-top: 20px; font: inherit; font-size: 12px; color: var(--text); background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 4px 14px; cursor: pointer; }
      #retry:hover { border-color: var(--accent); }
      body[data-state="failed"] #retry { display: block; }
      .version { position: absolute; bottom: 20px; font-size: 11px; color: var(--label); font-variant-numeric: tabular-nums; opacity: 0.7; }
      @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        body, .status > span { animation: none; }
        .fill.indeterminate { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body data-state="starting">
    <div data-tauri-drag-region class="drag"></div>
    <div class="logo" role="img" aria-label="Tide code">
      <svg class="mark" viewBox="-2 -2 198.5 200.25" aria-hidden="true">
        <defs><linearGradient id="g1" x1="6.77" y1="149.29" x2="197.57" y2="52.07" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#50e3c2"/><stop offset=".44" stop-color="#4ecdca"/><stop offset=".99" stop-color="#4a90e2"/></linearGradient>
        <linearGradient id="g2" x1="16.23" y1="204.94" x2="119.97" y2="152.09" gradientUnits="userSpaceOnUse" href="#g1"/></defs>
        <path d="M1.13,137.12c27.53-11.09,66.03-4.05,97.35,11.26,4.83,2.23,9.21,4.44,13.61,6.78,24.59,14.36,55.98,21.76,73.03,18.2,7.29-1.07,4.67-9.53,5.17-15.82,0-2.68,0-5.61,0-8.23.06-4.75-.16-6.4-4.76-5.72-19.01,2.77-36.14-13.6-33.84-32.85,1.49-14.88,14.4-26.47,29.15-26.55,2.85-.27,6.13.94,8.67.24.57-.33.71-1.04.75-1.74.06-4.16,0-14.69.03-24.51-.12-7.24.28-14.99-.19-20.77-.31-.66-1.22-.47-1.92-.52-9.17-.07-53.03.14-62.15-.09-1.41,0-1.1-2.8-1.01-4.53.17-3.04-.01-6.22-.74-9.26-2.07-8.96-8.34-16.56-16.69-20.32-20.65-9.53-44.19,7.53-42.01,29.92.11,2.12.38,4.37-1.56,4.26-2.98.05-10.03,0-18.38.02-13.81-.02-30.83.01-43.04,0-1.63.09-2.18-.27-2.29.9-.03,7.25,0,86.39-.01,98.02-.02.63.01,1.4.78,1.31h.06Z" fill="url(#g1)"/>
        <path d="M103.28,176.25c-12.45-6.62-23.31-11.63-36.23-15.75-34.54-10.79-54.05-5.19-65.46,1.92-1.9,1.84-1.72,5.42-1.36,8.01.67,4.97,2.8,9.6,6.06,13.19,3.96,4.86,11.86,8.06,17.74,8.32,11.45.19,58.07,0,91.23.06,12.36,0,21.89.01,24.65,0,.53-.02.48-.13-.3-.41-11.54-3.55-24.29-8.85-36.15-15.24l-.18-.09Z" fill="url(#g2)"/>
      </svg>
      <span class="word">code</span>
    </div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill"></div></div>
    <div class="status" id="status" aria-live="polite"><span>Starting the local server…</span></div>
    <button id="retry" type="button">Retry</button>
    <span class="version" id="version">v__TIDE_VERSION__</span>
    <script>
      // Desktop-only page. The shell pushes status into window.__tideStatus (see
      // server_supervisor.rs). Startup reports milestones, not percentages: each stage
      // eases toward a cap it never reaches, so the bar always moves and never rewinds.
      var STAGES = { starting: { cap: 0.72, tau: 6000 }, restarting: { cap: 0.72, tau: 6000 }, ready: { cap: 1, tau: 1 } };
      var fill = document.getElementById("fill");
      var bar = fill.parentNode;
      var progress = 0.04, floor = 0.04, since = performance.now(), state = "starting";
      if (document.getElementById("version").textContent.indexOf("__") >= 0) document.getElementById("version").remove();

      function setProgress(p) {
        progress = Math.max(0, Math.min(1, p));
        fill.classList.remove("indeterminate");
        fill.style.transform = "scaleX(" + progress + ")";
        bar.setAttribute("aria-valuenow", String(Math.round(progress * 100)));
      }
      function setText(text) {
        var box = document.getElementById("status");
        if (box.textContent === text) return;
        var span = document.createElement("span");
        span.textContent = text;
        box.replaceChildren(span);
        bar.setAttribute("aria-label", text);
      }
      setInterval(function () {
        var s = STAGES[state];
        if (!s) return;
        setProgress(floor + (s.cap - floor) * (1 - Math.exp(-(performance.now() - since) / s.tau)));
      }, 120);

      var LABELS = { starting: "Starting the local server…", restarting: "Restarting the local server…", ready: "Ready", closing: "Closing Tide…" };
      window.__tideStatus = function (next, message) {
        if (next !== state) { state = next; since = performance.now(); floor = progress; }
        document.body.dataset.state = next;
        var pct = /(\d+)%/.exec(message || "");
        if (next === "closing" || (next === "updating" && !pct)) {
          fill.classList.add("indeterminate");
          fill.style.transform = "";
          bar.removeAttribute("aria-valuenow");
        } else if (next === "updating") {
          setProgress(Number(pct[1]) / 100);
        } else if (next === "failed") {
          setProgress(1);
        }
        setText(next === "starting" || next === "ready" || next === "closing" ? LABELS[next] : (message || LABELS[next] || next));
      };
      // Retry is a plain fetch: the shell's scheme handler forwards it to the supervisor.
      document.getElementById("retry").onclick = function () {
        progress = 0.04;
        window.__tideStatus("starting");
        fetch("retry").catch(function () {});
      };
      // Anything pushed before this page finished loading is fetched from the shell.
      fetch("status").then(function (r) { return r.json(); }).then(function (s) {
        if (s && s.state) window.__tideStatus(s.state, s.message);
      }).catch(function () {});
      if (window.__TAURI__ && window.__TAURI__.event) {
        window.__TAURI__.event.listen("tide://server-status", function (e) {
          window.__tideStatus(e.payload.state, e.payload.message);
        }).catch(function () {});
      }
    </script>
  </body>
</html>
