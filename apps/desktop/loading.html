<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tide</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1013;
        --text: #e6e9ef;
        --muted: #8b93a3;
        --accent: #5b9dff;
        --danger: #ef6a6a;
        --sheen: #9fd8ff;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --bg: #f6f7f9; --text: #131722; --muted: #6a7285; --accent: #2f6fe0; --danger: #c93b3b; --sheen: #4a90e2; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center; 
        -webkit-user-select: none; user-select: none;
      }
      /* The window uses an overlay titlebar, so the top strip must drag it.
         Tauri picks this up from data-tauri-drag-region on a real element —
         -webkit-app-region is an Electron mechanism and does nothing here. */
      .drag { position: fixed; inset: 0 0 auto 0; height: 28px; z-index: 10; }
      .splash { display: flex; flex-direction: column; align-items: center; transition: transform 500ms var(--ease), filter 500ms var(--ease), opacity 500ms var(--ease); }
      body[data-state="ready"] .splash { transform: scale(1.04); filter: blur(4px); opacity: 0; }
      .logo { position: relative; display: flex; align-items: center; gap: 14px; height: 56px; animation: rise 900ms var(--ease) both; }
      .mark { height: 56px; width: auto; display: block; overflow: visible; }
      .mark .wave { transform-box: fill-box; transform-origin: 50% 50%; animation: float 3.6s ease-in-out 900ms infinite; }
      .word { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; color: transparent; background: linear-gradient(100deg, var(--text) 42%, var(--sheen) 50%, var(--text) 58%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; animation: sweep 5.2s var(--ease) 1.1s infinite; }
      .tide { position: relative; margin-top: 40px; width: 192px; height: 12px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); animation: fade 700ms ease-out 350ms both; }
      .strip { position: absolute; left: 0; top: 0; fill: var(--accent); }
      .back { opacity: 0.3; animation: drift 3.4s linear infinite reverse; }
      .front { opacity: 0.85; animation: drift 2.2s linear infinite; }
      .status { margin-top: 20px; display: flex; align-items: center; gap: 8px; animation: fade 700ms ease-out 500ms both; }
      .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-3%) rotate(-1.2deg); } }
      @keyframes sweep { 0% { background-position: 100% 0; } 38%, 100% { background-position: 0 0; } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-48px); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .logo, .tide, .strip, .status, .pulse, .mark .wave, .word { animation: none; } }
      #msg { color: var(--muted); font-size: 13px; text-align: center; max-width: 70ch; }
      #retry { display: none; margin-top: 16px; font: inherit; color: var(--text); background: transparent; border: 1px solid var(--muted); border-radius: 6px; padding: 4px 14px; cursor: pointer; }
      #retry:hover { border-color: var(--accent); }
      body[data-state="failed"] #retry { display: block; }
      body[data-state="failed"] .pulse, body[data-state="failed"] .tide { display: none; }
      body[data-state="failed"] #msg { color: var(--danger); white-space: pre-wrap; }
    </style>

      <div class="status"><span class="pulse"></span><div id="msg">starting the local server…</div></div>
      <button id="retry" type="button">Retry</button>

    <script>
      // Desktop-only page. The shell pushes status straight into this hook (see
      // server_supervisor.rs); the `tide://server-status` event is used when the
      // global Tauri API happens to be available.
      window.__tideStatus = function (state, message) {
        document.body.dataset.state = state;
        document.getElementById("msg").textContent = message || state;
      };
      // Retry is a plain fetch: the shell's scheme handler forwards it to the supervisor.
      document.getElementById("retry").onclick = function () {
        window.__tideStatus("starting", "starting the local server…");
        fetch("retry").catch(function () {});
      };
      // Anything pushed before this page finished loading is fetched from the shell.
      fetch("status").then(function (r) { return r.json(); }).then(function (s) {
        if (s && s.state) window.__tideStatus(s.state, s.message);
      }).catch(function () {});
      if (window.__TAURI__ && window.__TAURI__.event) {
        window.__TAURI__.event
          .listen("tide://server-status", function (e) {
            window.__tideStatus(e.payload.state, e.payload.message);
          })
          .catch(function () {});
      }
    </script>
