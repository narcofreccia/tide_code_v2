# Windows release — NSIS installer + updater artifact, published to R2.
#
# Manually triggered (Actions -> release-windows -> Run workflow) because a release is a
# deliberate act: bump the version, run the macOS script locally, then run this so both
# platforms ship the same version — the updater manifest carries ONE global version, so a
# lagging platform update-loops (docs/RELEASING.md).
#
# The tide-server sidecar is cross-compiled here with Bun. Known limitation: Bun has no
# Windows PTY, so the Windows build ships without terminals (the server reports the
# terminal feature as unavailable); everything else works.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/tidecode2.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  tidecode2
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY   the house r2 token (storage bucket)
name: release-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version (optional) — the job fails if package.json differs"
        required: false
        type: string

env:
  R2_ENDPOINT: https://d76960bd74940e6213de6aa16f3e04fd.r2.cloudflarestorage.com
  R2_BUCKET: storage/tidecode
  TIDE_PUBLIC_BUCKET: https://pub-7b3e5bbd605d43adbeb4601a962d84bd.r2.dev/tidecode

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm is pinned by `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true

      - name: Check the version input
        if: inputs.version != ''
        run: |
          actual="$(node -p "require('./package.json').version")"
          [ "$actual" = "${{ inputs.version }}" ] || { echo "package.json is $actual, expected ${{ inputs.version }}"; exit 1; }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build the tide-server sidecar (windows-x64)
        run: bash scripts/build-server-sidecar.sh --target windows-x64

      - name: Build the web client
        run: pnpm --filter @tide/web build

      - name: Build the Tauri app (NSIS + updater signature)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @tide/desktop exec tauri build --bundles nsis

      # Smoke test: install silently, then prove the bundled sidecar actually runs.
      - name: Smoke test the installed build
        run: |
          set -euo pipefail
          setup="$(ls -t apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)"
          echo "installing $setup"
          "$setup" /S
          for _ in $(seq 1 30); do
            server="$(find "/c/Program Files/Tide" "$LOCALAPPDATA/Tide" -name 'tide-server*.exe' 2>/dev/null | head -1 || true)"
            [ -n "$server" ] && break
            sleep 2
          done
          [ -n "$server" ] || { echo "installed tide-server.exe not found"; exit 1; }
          echo "running $server"
          TIDE_HOME="$RUNNER_TEMP/tide-smoke" "$server" --dev --port 3799 &
          pid=$!
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:3799/health" && break || sleep 1
          done
          curl -fsS "http://127.0.0.1:3799/health" || { echo "sidecar never answered /health"; kill $pid; exit 1; }
          kill $pid || true
          echo "smoke test OK"

      - name: Publish to R2 (fixed name, merge windows-x86_64 key, verify updater)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/release/publish_windows.sh
